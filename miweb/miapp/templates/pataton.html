{% extends 'base.html' %}

{% block content %}

<h1>Base de datos pataton(Pedazo nombre por cierto)</h1>

{% for patatica in pataton %}

<article>
<h1>{{patatica.nombre}}</h1>
<form action="{% url 'eliminarPataton' patatica.id %}" method="POST" style="display:inline;">
    {% csrf_token %}
    <button type="submit">❌ Eliminar</button>
  </form>

<form action="{% url 'editarPataton' patatica.id %}" method="GET" style="display:inline;">
    <button type="submit">✏️ Editar</button>
</form>
</article>

{% endfor %}

{% endblock %}
