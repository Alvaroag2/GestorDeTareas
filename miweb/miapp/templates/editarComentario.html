{% extends 'base.html' %}

{% block content %}
<a href="{% url 'detalleTarea' comentario.tarea.id %}">⬅️ Cancelar y volver a la tarea</a>

<h2>✏️ Editar comentario</h2>

<article style="border: 1px solid #ccc; padding: 20px; border-radius: 8px; margin-top: 15px; max-width: 600px;">
  <!-- ⚠️ enctype="multipart/form-data" ES OBLIGATORIO PARA LAS IMÁGENES -->
  <form action="{% url 'editarComentario' comentario.id %}" method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" style="background-color: #27ae60; color: white; border: none; padding: 10px 18px; border-radius: 5px; cursor: pointer; font-size: 1em; margin-top: 10px;">
      💾 Guardar cambios
    </button>
  </form>
</article>
{% endblock %}
