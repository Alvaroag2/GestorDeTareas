{% extends 'base.html' %}

{% block content %}

<h1>Usuarios</h1>
{% if messages %}
  <div class="messages">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }}">
        {{ message }}
      </div>
    {% endfor %}
  </div>
{% endif %}

{% for user in usuario %}

<article>
<h1>{{user.username}}</h1>
<form action="{% url 'eliminarUsuario' user.id %}" method="POST" style="display:inline;">
    {% csrf_token %}
    <button type="submit">❌ Eliminar</button>
  </form>

<form action="{% url 'editarUsuario' user.id %}" method="POST" style="display:inline;">
    <button type="submit">✏️ Editar</button>
</form>
</article>

{% endfor %}

{% endblock %}
